# Atualizações de segurança das ferramentas, scripts, testes e Actions.
# As bibliotecas de public/vendor/ são trocadas à mão (versão no nome do arquivo).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /scripts
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /tests/e2e
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
