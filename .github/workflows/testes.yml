# Roda os testes a cada push e pull request. Se algo falhar, o GitHub avisa
# antes de a mudança ir para o ar (o Cloudflare publica o que estiver na main).
name: testes
on:
  push:
  pull_request:

jobs:
  regras:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
        working-directory: scripts
      - run: npm test

  banco:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/banco/rodar.sh
        env:
          PSQL: psql -h localhost -U postgres
          PGPASSWORD: postgres

  navegador:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
        working-directory: tests/e2e
      - run: npx playwright install --with-deps chromium
        working-directory: tests/e2e
      - run: node tests/e2e/rodar.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: capturas-e-relatorio, path: tests/e2e/saida }

  cloudflare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npx wrangler deploy --dry-run
