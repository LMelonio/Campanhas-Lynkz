# ============================================================
#  LYNKZ Campanhas — modelo para servidor próprio (nginx).
#  Mesmos cabeçalhos de public/_headers. O site é SÓ a pasta public/.
#  HTTPS é obrigatório: sem ele o app não instala no celular (service
#  worker) e o login do Supabase recusa o endereço.
#
#  Instalar:  copie public/ para /var/www/lynkz-campanhas/public,
#             deploy/lynkz-seguranca.conf para /etc/nginx/snippets/,
#             ajuste server_name e certificados, nginx -t e recarregue.
#  Atualizar: troque o conteúdo de public/ (git pull + rsync). Nada a compilar.
# ============================================================
server {
    listen 443 ssl http2;
    server_name campanhas.lynkz.com.br;              # ajuste

    ssl_certificate     /etc/ssl/lynkz/fullchain.pem;  # ajuste
    ssl_certificate_key /etc/ssl/lynkz/privkey.pem;    # ajuste

    root  /var/www/lynkz-campanhas/public;
    index index.html;
    charset utf-8;

    # Segurança: copie deploy/lynkz-seguranca.conf para /etc/nginx/snippets/
    include /etc/nginx/snippets/lynkz-seguranca.conf;

    # O app usa rotas com # (#/campanhas/12): não precisa de reescrita.
    location / {
        try_files $uri $uri/ =404;
    }

    # Sempre a versão nova destes dois (troca de versão e de chaves).
    location = /sw.js     { add_header Cache-Control "no-cache" always; include /etc/nginx/snippets/lynkz-seguranca.conf; }
    location = /config.js { add_header Cache-Control "no-cache" always; include /etc/nginx/snippets/lynkz-seguranca.conf; }
    location /assets/     { add_header Cache-Control "public, max-age=86400" always; include /etc/nginx/snippets/lynkz-seguranca.conf; }

    # Nada de arquivos ocultos nem o próprio _headers.
    location ~ /\.  { deny all; }
    location = /_headers { return 404; }

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
}

server {
    listen 80;
    server_name campanhas.lynkz.com.br;              # ajuste
    return 301 https://$host$request_uri;
}
